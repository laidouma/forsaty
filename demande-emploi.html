<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande d'Emploi - Forsaty</title>
    <link rel="stylesheet" href="style.css"> <!-- Lien vers le fichier CSS -->
</head>
<body>

<header>
    <div class="header-container">
        <div class="logo-container">
            <img src="logo.png" alt="Logo Forsaty" class="logo"> <!-- Logo localisé ici -->
        </div>
        <div class="header-buttons">
            <a href="index.html" class="button">Accueil</a>
            <a href="contact.html" class="button">Contact</a>
        </div>
    </div>
</header>

<section class="job-request-section">
    <h2>Envoyer une Demande d'Emploi</h2>

    <div class="job-request-form">
        <form action="mailto:votre-email@domaine.com" method="post" enctype="text/plain">
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" required>

            <label for="email">Email :</label>
            <input type="email" id="email" name="email" required>

            <label for="position">Position Recherchée :</label>
            <input type="text" id="position" name="position" required>

            <label for="message">Message :</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit" class="button">Envoyer la Demande</button>
        </form>
    </div>
</section>

<footer>
    <p>© 2024 Forsaty - Tous droits réservés</p>
</footer>

</body>
</html>
