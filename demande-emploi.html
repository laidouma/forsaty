<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande d'Emploi - Forsaty</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="header-container">
        <!-- Logo avec lien vers la page d'accueil -->
        <div class="logo-container">
            <a href="index.html">
                <img src="logo.png" alt="Logo Forsaty" class="logo">
            </a>
        </div>
        <!-- Boutons de navigation -->
        <div class="header-buttons">
            <a href="index.html" class="button">Accueil</a>
            <a href="contact.html" class="button">Contact</a>
            <a href="qui-sommes-nous.html" class="button">Qui sommes-nous ?</a> <!-- Lien ajouté vers "Qui sommes-nous ?" -->
        </div>
    </div>
</header>

<section class="job-request-section">
    <h2>Envoyer une Demande d'Emploi</h2>
    <form action="mailto:votre-email@domaine.com" method="post" enctype="text/plain">
        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom" required>

        <label for="email">Email :</label>
        <input type="email" id="email" name="email" required>

        <label for="position">Position Recherchée :</label>
        <input type="text" id="position" name="position" required>

        <label for="message">Message :</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" class="button">Envoyer la Demande</button>
    </form>
</section>

<footer style="background-color: #4B0F27; color: white; text-align: center; padding: 15px;">
    <p>© 2024 Forsaty - Tous droits réservés</p>
</footer>

</body>
</html>
