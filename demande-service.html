<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envoyer une Demande - Forsaty</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="header-container">
        <div class="logo-container">
            <img src="https://forsatyfr.wordpress.com/wp-content/uploads/2024/11/forsaty__2_-removebg-preview-1.png" alt="Logo Forsaty" class="logo">
        </div>
        <div class="header-buttons">
            <a href="index.html" class="button">Retour à l'accueil</a>
        </div>
    </div>
</header>

<section>
    <h2>Envoyer une Demande de Service</h2>
    <p>Veuillez remplir ce formulaire pour soumettre une demande de service. Nous vous répondrons dans les plus brefs délais.</p>

    <!-- Formulaire -->
    <form action="send-email.php" method="POST">
        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom" required>

        <label for="email">Email :</label>
        <input type="email" id="email" name="email" required>

        <label for="demande">Description de la demande :</label>
        <textarea id="demande" name="demande" rows="4" required></textarea>

        <button type="submit" class="button">Envoyer la demande</button>
    </form>
</section>

<footer style="background-color: #4B0F27; color: white; text-align: center; padding: 15px;">
    <p>© 2024 Forsaty - Tous droits réservés</p>
</footer>

</body>
</html>
