<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande de Service - Forsaty</title>
    <link rel="stylesheet" href="style.css"> <!-- Lien vers votre fichier CSS -->
</head>
<body>

<header>
    <div class="header-container">
        <!-- Logo avec lien vers la page d'accueil -->
        <div class="logo-container">
            <a href="index.html">
                <img src="logo.png" alt="Logo Forsaty" class="logo">
            </a>
        </div>
        <!-- Boutons de navigation -->
        <div class="header-buttons">
            <a href="index.html" class="button">Accueil</a>
            <a href="contact.html" class="button">Contact</a>
            <a href="qui-sommes-nous.html" class="button">Qui sommes-nous ?</a> <!-- Lien ajouté vers "Qui sommes-nous ?" -->
        </div>
    </div>
</header>

<section class="service-request-section">
    <h2>Envoyer une Demande de Service</h2>
    <p>Utilisez ce formulaire pour soumettre votre demande de service. Nous vous répondrons dès que possible avec des informations personnalisées.</p>

    <div class="service-request-form">
        <form action="votre-script-d'envoi.php" method="POST">
            
            <!-- Informations de Contact -->
            <fieldset>
                <legend>Informations de Contact</legend>

                <label for="nom">Nom :</label>
                <input type="text" id="nom" name="nom" required>

                <label for="email">Email :</label>
                <input type="email" id="email" name="email" required>

                <label for="tel">Téléphone :</label>
                <input type="tel" id="tel" name="tel">
            </fieldset>

            <!-- Détails du Service -->
            <fieldset>
                <legend>Détails du Service</legend>

                <label for="service-type">Type de Service :</label>
                <select id="service-type" name="service_type" required>
                    <option value="rédaction">Rédaction de Mémoires</option>
                    <option value="correction">Correction Linguistique</option>
                    <option value="cours">Cours Particuliers</option>
                    <option value="numérique">Services Numériques</option>
                    <option value="formation">Formations Professionnelles</option>
                    <option value="orientation">Consultations en Orientation</option>
                </select>

                <label for="description">Description de la Demande :</label>
                <textarea id="description" name="description" rows="5" required></textarea>

                <label for="budget">Budget Estimé :</label>
                <input type="text" id="budget" name="budget">
            </fieldset>

            <button type="submit">Envoyer la Demande</button>
        </form>
    </div>
</section>

<footer style="background-color: #4B0F27; color: white; text-align: center; padding: 15px;">
    <p>© 2024 Forsaty - Tous droits réservés</p>
</footer>

</body>
</html>
