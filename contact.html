<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Forsaty</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-section {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .contact-section h2 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .contact-info {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .contact-info p {
            margin: 10px 0;
        }

        .contact-info a {
            color: #4B0F27;
            text-decoration: none;
        }

        .contact-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <div class="logo-container">
            <a href="index.html">
                <img src="logo.png" alt="Logo Forsaty" class="logo">
            </a>
        </div>
        <div class="header-buttons">
            <a href="index.html" class="button">Accueil</a>
            <a href="contact.html" class="button active">Contact</a>
            <a href="qui-sommes-nous.html" class="button">Qui sommes-nous ?</a>
        </div>
    </div>
</header>

<section class="contact-section">
    <h2>Contactez-nous</h2>
    <div class="contact-info">
        <p><strong>Email :</strong> <a href="mailto:groupforsaty@gmail.com">groupforsaty@gmail.com</a></p>
        <p><strong>Téléphone :</strong> <a href="tel:+213666370876">0666 37 08 76</a></p>
    </div>
</section>

<footer style="background-color: #4B0F27; color: white; text-align: center; padding: 15px;">
    <p>© 2024 Forsaty - Tous droits réservés</p>
</footer>

</body>
</html>
