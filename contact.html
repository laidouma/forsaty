<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactez-nous - Forsaty</title>
    <link rel="stylesheet" href="style.css"> <!-- Lien vers votre fichier CSS -->
</head>
<body>

<header>
    <div class="header-container">
        <!-- Logo avec lien vers la page d'accueil -->
        <div class="logo-container">
            <a href="index.html">
                <img src="logo.png" alt="Logo Forsaty" class="logo">
            </a>
        </div>
        <!-- Boutons de navigation -->
        <div class="header-buttons">
            <a href="index.html" class="button">Accueil</a>
            <a href="contact.html" class="button">Contact</a>
            <a href="qui-sommes-nous.html" class="button">Qui sommes-nous ?</a> <!-- Lien ajouté vers "Qui sommes-nous ?" -->
        </div>
    </div>
</header>

<section class="contact-section">
    <h2>Contactez-nous</h2>

    <div class="contact-info">
        <p><strong>Adresse :</strong> 123 Rue d'Algérie, Alger, Algérie</p>
        <p><strong>Email :</strong> contact@forsaty.com</p>
        <p><strong>Téléphone :</strong> +213 555 555 555</p>
    </div>

    <div class="contact-form">
        <h3>Envoyez-nous un message</h3>
        <form action="votre-script-d'envoi.php" method="POST">
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" required>

            <label for="email">Email :</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message :</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Envoyer</button>
        </form>
    </div>
</section>

<footer style="background-color: #4B0F27; color: white; text-align: center; padding: 15px;">
    <p>© 2024 Forsaty - Tous droits réservés</p>
</footer>

</body>
</html>
