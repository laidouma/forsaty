<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>فورساتي - اتصل بنا</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            direction: rtl;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            color: #333;
        }

        header {
            background-color: #4B0F27;
            padding: 15px 0;
            color: white;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo {
            height: 80px;
            width: 80px;
            border-radius: 50%;
            object-fit: cover;
        }

        .header-buttons .button {
            color: white;
            margin-left: 15px;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
            transition: background 0.3s ease;
        }

        .header-buttons .button:hover,
        .header-buttons .active {
            background-color: #7A1F3D;
        }

        .contact-section {
            max-width: 700px;
            margin: 60px auto;
            padding: 40px;
            background-color: #fdf8f9;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.07);
            text-align: center;
        }

        .contact-section h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #4B0F27;
        }

        .contact-section .subheading {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 30px;
        }

        .contact-info {
            font-size: 1.15rem;
            line-height: 2;
        }

        .contact-info p {
            margin: 15px 0;
        }

        .contact-info a {
            color: #4B0F27;
            text-decoration: none;
            font-weight: 600;
        }

        .contact-info a:hover {
            text-decoration: underline;
        }

        footer {
            background-color: #4B0F27;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 60px;
        }

        @media (max-width: 600px) {
            .header-container {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-buttons {
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <div class="logo-container">
            <a href="index.html">
                <img src="logo.png" alt="Logo Forsaty" class="logo" />
            </a>
        </div>
        <div class="header-buttons">
            <a href="index.html" class="button">الصفحة الرئيسية</a>
            <a href="contact2.html" class="button active">اتصل بنا</a>
            <a href="qui-sommes-nous2.html" class="button">من نحن؟</a>
            <a href="contact.html" class="button">Français</a> <!-- Lien vers la version française -->
        </div>
    </div>
</header>

<section class="contact-section">
    <h2>اتصل بنا</h2>
    <p class="subheading">هل لديك سؤال؟ مشروع؟ اكتب لنا، وسنكون سعداء بالرد عليك!</p>
    <div class="contact-info">
        <p><strong>البريد الإلكتروني:</strong> <a href="mailto:groupforsaty@gmail.com">groupforsaty@gmail.com</a></p>
        <p><strong>الهاتف:</strong> <a href="tel:+213666370876">06 66 37 08 76</a></p> <!-- Le numéro est correctement affiché dans l'ordre arabe -->
    </div>
</section>

<footer>
    <p>© 2024 فورساتي - جميع الحقوق محفوظة</p>
</footer>

</body>
</html>
