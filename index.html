<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forsaty - Votre Opportunité d'Apprendre et de Réussir</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .image-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin: 40px 0;
        }

        .image-links a {
            display: block;
            width: 300px;
            transition: transform 0.3s ease;
        }

        .image-links a:hover {
            transform: scale(1.05);
        }

        .image-links img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <div class="logo-container">
            <a href="index.html">
                <img src="logo.png" alt="Logo Forsaty" class="logo">
            </a>
        </div>
        <div class="header-buttons">
            <a href="index.html" class="button">Accueil</a>
            <a href="qui-sommes-nous.html" class="button">Qui sommes-nous ?</a>
            <a href="contact.html" class="button">Contact</a>
        </div>
    </div>
</header>

<section>
    <h2>Nos Espaces</h2>
    <div class="image-links">
        <a href="inscription.html">
            <img src="inscription.jpg" alt="Inscription à l’Espace Sahwa">
        </a>
        <a href="demande-emploi.html">
            <img src="emploi.jpg" alt="Demande d'emploi">
        </a>
        <a href="demande-service.html">
            <img src="service.jpg" alt="Demande de service">
        </a>
    </div>
</section>

<footer style="background-color: #4B0F27; color: white; text-align: center; padding: 15px;">
    <p>© 2024 Forsaty - Tous droits réservés</p>
</footer>

</body>
</html>
